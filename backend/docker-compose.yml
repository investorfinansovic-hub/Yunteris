services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleanmarket
      POSTGRES_PASSWORD: cleanmarket
      POSTGRES_DB: cleanmarket
    ports:
      - "5432:5432"
    volumes:
      - cleanmarket_pgdata:/var/lib/postgresql/data

volumes:
  cleanmarket_pgdata:
