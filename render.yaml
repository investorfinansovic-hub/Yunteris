databases:
  - name: chistomarket-db
    plan: free
    databaseName: chistomarket
    user: chistomarket

services:
  - type: web
    name: chistomarket-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chistomarket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: chistomarket-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # If Render had to rename chistomarket-api (name already taken), update
      # this to match its real URL and trigger a manual redeploy of this site.
      - key: VITE_API_BASE_URL
        value: https://chistomarket-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
